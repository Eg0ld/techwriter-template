name: Secrets Scan

# TruffleHog over the commits a pull request adds, and over each push to main.
# --only-verified: the job fails only on a credential its provider confirms is
# live, so a red run means a real key to rotate, not a pattern match.
#
# It finds a secret after it is pushed, not before. Rotate first, then remove.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR cancels the older scan. Pushes to main are never
# cancelled: each one scans only its own commits (before..after).
concurrency:
  group: secrets-scan-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action is pinned by commit SHA, and the scanner image by digest:
      # the action's `version` input defaults to `latest`, so pinning the
      # action alone would still run whatever image was published last.
      # Bump both together.
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          version: 3.97.9@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db
          extra_args: --only-verified
