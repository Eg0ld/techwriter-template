name: Dependabot Auto-merge

# Only semver-patch and semver-minor updates are auto-merged, after the CI build
# passes. Majors, and group PRs that contain a major, stay open for a human.
#
# The gate can't tell who enabled auto-merge. If you enable it by hand on a
# PR the gate refuses (e.g. a major you reviewed), the next Dependabot push
# to that PR (a rebase) turns it off again; re-enable it after that push.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  check_suite:
    types: [completed]

# A newer push to a PR cancels the older run, so a stale run can't turn
# auto-merge back on after a newer run turned it off. Each check_suite run
# checks and merges one exact commit (--match-head-commit), so their order
# doesn't matter and each gets a group of its own.
concurrency:
  group: dependabot-automerge-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Each job asks for what it needs.
permissions: {}

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    # fetch-metadata is third-party code, and a Dependabot PR can bump it, so
    # it runs with a read-only token and only hands its outputs on.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      update-type: ${{ steps.metadata.outputs.update-type }}
      updated-dependencies-json: ${{ steps.metadata.outputs.updated-dependencies-json }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

  auto-merge-on-pr:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # !cancelled() so a failed metadata job still reaches the gate, which then
    # refuses (its inputs are empty) and turns off any earlier auto-merge.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge for patch and minor updates only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATE_TYPE: ${{ needs.metadata.outputs.update-type }}
          UPDATED_DEPENDENCIES: ${{ needs.metadata.outputs.updated-dependencies-json }}
        run: |
          # update-type is the highest bump in the PR, so a group containing a
          # major reports semver-major. fetch-metadata drops entries whose bump it
          # can't work out before taking that maximum, so also require every
          # entry to be patch or minor. Anything else (including empty output
          # because the metadata job failed) is left for manual review.
          eligible=false
          case "$UPDATE_TYPE" in
            version-update:semver-patch | version-update:semver-minor)
              if jq -e 'length > 0 and all(.[]; .updateType == "version-update:semver-patch" or .updateType == "version-update:semver-minor")' \
                  <<<"$UPDATED_DEPENDENCIES" >/dev/null; then
                eligible=true
              fi
              ;;
          esac

          if [ "$eligible" = true ]; then
            # --match-head-commit: only arm auto-merge for the commit this run
            # was triggered for. If Dependabot pushed again meanwhile, this
            # fails and the newer run decides.
            gh pr merge "$PR_NUMBER" \
              --auto \
              --squash \
              --match-head-commit "$HEAD_SHA" \
              --repo "$GITHUB_REPOSITORY"
          else
            echo "::notice::update-type '${UPDATE_TYPE:-unknown}' is not patch/minor for every dependency; leaving PR #$PR_NUMBER for manual review."
            # A later push can turn an eligible PR into a major, so disarm any
            # auto-merge an earlier run enabled. If the current state can't be
            # read, try to disarm anyway; if that fails too, the step fails.
            armed=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null') || {
              echo "::warning::Could not read the auto-merge state of PR #$PR_NUMBER; disabling auto-merge to be safe."
              armed=unknown
            }
            if [ "$armed" != false ]; then
              gh pr merge "$PR_NUMBER" --disable-auto --repo "$GITHUB_REPOSITORY"
            fi
          fi

  auto-merge-on-check-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge on passing Dependabot PRs (patch and minor only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.check_suite.head_sha }}
        run: |
          # Find open Dependabot PRs whose head SHA matches this check suite
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --author "app/dependabot" \
            --state open \
            --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number" \
          | while read -r PR_NUMBER; do
              # fetch-metadata needs a pull_request payload, which check_suite
              # events don't carry, so apply the same gate to the metadata block
              # in Dependabot's signed commit: every entry must state a patch or
              # minor update-type. Anything else is left alone here, including
              # indirect/security bumps whose metadata omits update-type (the
              # pull_request job above works those out from the versions).
              # Every commit on the PR must be Dependabot's own and verified, so
              # a commit added on top of its work can't ride along.
              unverified=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" \
                --jq '[.[] | select(.author.login != "dependabot[bot]" or .commit.verification.verified != true)] | length' \
                | awk '{ n += $1 } END { print n + 0 }')
              if [ "$unverified" != 0 ]; then
                echo "::notice::PR #$PR_NUMBER has a commit that is not a verified Dependabot commit; skipping."
                continue
              fi
              commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA")
              if [ "$(jq -r '.author.login' <<<"$commit")" != 'dependabot[bot]' ] \
                  || [ "$(jq -r '.commit.verification.verified' <<<"$commit")" != true ]; then
                echo "::notice::PR #$PR_NUMBER head is not a verified Dependabot commit; skipping."
                continue
              fi
              metadata=$(jq -r '.commit.message' <<<"$commit" | awk '/^\.\.\.$/ && f { f = 0; done = 1 } f; /^---$/ && !done { f = 1 }')
              entries=$(grep -c '^- ' <<<"$metadata" || true)
              eligible=$(grep -cE '^  update-type: version-update:semver-(patch|minor)$' <<<"$metadata" || true)
              if [ "$entries" -gt 0 ] && [ "$entries" -eq "$eligible" ]; then
                # --match-head-commit: merge only the commit checked above,
                # not whatever the PR head has moved to since.
                gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$HEAD_SHA" --repo "$GITHUB_REPOSITORY" || true
              else
                echo "::notice::PR #$PR_NUMBER is not an explicit patch/minor update; leaving it for manual review."
              fi
            done
