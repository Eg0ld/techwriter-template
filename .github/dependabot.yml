version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TS 7.x removed `baseUrl`, which @docusaurus/tsconfig (3.10.x) still sets.
      # `npm run typecheck` fails under TS7 no matter what this repo's own
      # tsconfig.json says. Every tenant repo inherits this config, so keep the
      # pin until Docusaurus ships a TS7-compatible tsconfig.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
